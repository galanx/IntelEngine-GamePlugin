requires: political_engine
# Political Engine realms as IntelEngine factions. Loaded only when Political Engine is detected and
# politics.pe_integration is on. Leaders are overwritten with the live rulers while PE is running.
# Same-id entries in a later fragment replace these whole. Realm 9 (the player's) is not listed.
factions:
  - id: "PE_Solitude"
    name: "Solitude (Political Engine)"
    type: "political"
    hold: "Solitude"
    leader_names: ["Elisif the Fair"]
    rivals: ["StormcloakFaction"]
    allies: ["ImperialFaction"]
    war_threshold: -50
