# IntelEngine Settings — sample defaults
# To restore: copy this file as "settings.yaml" in the same folder.
# IntelEngine reads this file for plugin and politics settings.
# Politics setting changes from the MCM and dashboard are saved here.
ui:
  host: auto # auto, magelight, or prismaui; selection applies after restart
  dashboard_hotkey: 55
  dashboard_modifiers: 2
story:
  faction_whitelist: ""
  faction_blocklist: ""
  location_whitelist: ""
  npc_whitelist: ""
  npc_blocklist: ""
politics:
  enabled: true
  pe_integration: false
  pe_reactions_move_relations: true
  tick_interval_hours: 6
  max_relation_change_per_tick: 15
  max_active_wars: 2
