customCategory: intel_communication
name: SendWordBack
description: >
  Someone asked {{ player.name }} to find you or to speak with you (you know it under "Errands about me").
  Once {{ player.name }} has told you so, send that person your answer through {{ player.name }}, or go along with
  {{ player.name }} to see them yourself, or both.

  Use ONLY after you have given your answer in your own words in this conversation. Not for small talk.

questEditorId: IntelEngine_Threads
scriptName: IntelEngine_Threads
executionFunctionName: SendWordBack

parameterMapping:
  - type: speaker
    name: akNPC
    description: You (the one it is about)
  - type: dynamic
    name: answer
    description: >
      Your answer for the one who asked, in a sentence of your own: what {{ player.name }} is to tell them.
      "none" when you only go along.
  - type: dynamic
    name: comeAlong
    description: 1 if you go with {{ player.name }} to see them now, 0 if not.

eligibilityRules:
  - conditions:
      - decoratorName: is_in_combat
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
      - decoratorName: get_intelengine_storyline_about
        arguments: ["currentActor"]
        comparisonOperator: "is_not_empty"
        expectedValue: ""
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} gave {{ player.name }} an answer to carry back"
isShortLived: true
enabled: true
defaultPriority: 5
tags: []
