customCategory: intel_communication
name: PlayerTurnsDownRequest
description: >
  {{ player.name }} has just clearly refused to do what you asked of them earlier (you remember it under
  "What I asked of {{ player.name }}"). It takes the request out of {{ player.name }}'s journal, and you will
  remember the refusal.

  Use ONLY on a clear no. "Later", "maybe" or changing the subject is not a refusal.

questEditorId: IntelEngine_Threads
scriptName: IntelEngine_Threads
executionFunctionName: PlayerTurnsDownRequest

parameterMapping:
  - type: speaker
    name: akNPC
    description: You (the one who asked)

eligibilityRules:
  - conditions:
      - decoratorName: get_intelengine_open_storyline
        arguments: ["currentActor"]
        comparisonOperator: "is_not_empty"
        expectedValue: ""
    logicalOperator: "AND"
    required: true

eventString: "{{ player.name }} turned down what {{ actor.name }} asked"
isShortLived: true
enabled: true
defaultPriority: 5
tags: []
