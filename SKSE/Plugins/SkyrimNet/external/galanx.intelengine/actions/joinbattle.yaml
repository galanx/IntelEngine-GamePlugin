customCategory: intel_communication
name: JoinBattle
description: >
  You stand in an army that is drawn up for battle or fighting one (you know it under "Right now"), and
  {{ player.name }} has just told you in plain words that they will fight on your side in it, now. You take
  them into your line.

  Use it in the same reply in which you welcome them in your own words.

  DECISION RULES:
  - ONLY when they have said clearly that they will fight on YOUR side in THIS battle
    ("I'm with you", "I stand with you today", "Count my sword in")
  - Do NOT select it for a question ("who are you fighting?"), for praise of your side, or for help offered later
  - Do NOT select it when they say they will fight for the other side, or keep out of it

questEditorId: IntelEngine
scriptName: IntelEngine_Battle
executionFunctionName: JoinBattleByWord

parameterMapping:
  - type: speaker
    name: akSpeaker
    description: You (the soldier they spoke to)

eligibilityRules:
  - conditions:
      - decoratorName: get_intelengine_battle_side
        arguments: ["currentActor"]
        comparisonOperator: "is_not_empty"
        expectedValue: ""
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} took {{ player.name }} into their line of battle"
isShortLived: true
enabled: true
defaultPriority: 5
tags: []
