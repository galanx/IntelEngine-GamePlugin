customCategory: intel_communication
name: Communication
description: "Messages, requests and reactions — SELECT THIS when {{ npc.name }} is asked to deliver a message to someone; when {{ npc.name }} asks {{ player.name }} for real help (to find someone, bring an item, take them somewhere, speak with someone), changes what they asked of {{ player.name }} (no longer needs it, gives more time, needs it sooner, offers more gold, wants something else instead), or {{ player.name }} turns such a request down; when {{ npc.name }}, on the way to clear out a place, asks {{ player.name }} to come along, or agrees when {{ player.name }} asks to come; when someone asked {{ player.name }} to find or speak with {{ npc.name }} and {{ npc.name }} sends an answer back or goes along to see them; or when {{ npc.name }} reacts to {{ player.name }} expressing a political opinion, faction loyalty, insult, or support."
enabled: true
