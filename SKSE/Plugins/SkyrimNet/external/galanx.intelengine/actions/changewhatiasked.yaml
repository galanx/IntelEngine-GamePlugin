customCategory: intel_communication
name: ChangeWhatIAsked
description: >
  Change what you asked of {{ player.name }} earlier (you remember it under "What I asked of {{ player.name }}"),
  because of what was just said in this conversation. {{ player.name }}'s journal and your reward follow the change.

  call_off: you no longer need it (it was settled another way, or you changed your mind).
  more_time: you give {{ player.name }} two more days.
  hurry: it has become urgent; you need it within half a day.
  raise_reward: you promise more gold for it than you offered.
  new_subject: you now need another person found or spoken with, another item, or another place to be taken to.

  Use it in the same reply in which you state the change in your own words. Not for small talk, not when
  {{ player.name }} refuses (that is PlayerTurnsDownRequest), and not to repeat what is so already.

questEditorId: IntelEngine_Threads
scriptName: IntelEngine_Threads
executionFunctionName: ChangeWhatIAsked

parameterMapping:
  - type: speaker
    name: akNPC
    description: You (the one who asked)
  - type: dynamic
    name: change
    description: Exactly one of call_off, more_time, hurry, raise_reward, new_subject.
  - type: dynamic
    name: subject
    description: >
      For new_subject: the new person's or item's name, exactly as they are called (e.g. "Ysolda", "Nord Mead").
      Otherwise "none".
  - type: dynamic
    name: place
    description: >
      For new_subject when you now want to be taken somewhere else: the new place (a town, an inn or a landmark).
      Otherwise "none".
  - type: dynamic
    name: gold
    description: For raise_reward, the new sum of gold you promised, as a number (e.g. 200). Otherwise 0.
  - type: dynamic
    name: reason
    description: >
      Why, in a few words of your own (e.g. "she came home on her own"). "none" when no reason was given.

eligibilityRules:
  - conditions:
      - decoratorName: is_in_combat
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
      - decoratorName: get_intelengine_open_storyline
        arguments: ["currentActor"]
        comparisonOperator: "is_not_empty"
        expectedValue: ""
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} changed what they asked of {{ player.name }} ({{ change }})"
isShortLived: true
enabled: true
defaultPriority: 5
tags: []
