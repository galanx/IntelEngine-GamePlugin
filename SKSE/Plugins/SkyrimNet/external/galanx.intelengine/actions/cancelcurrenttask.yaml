customCategory: intel_travel
name: CancelCurrentTask
description: >
  Stop your current active task entirely.

  Use ONLY when {{ player.name }} has just told you to stop, wait, hold on, come back or stay, or to follow them
  instead (cancel the task first, then follow).

  A task you were given is carried out. Setting off, arriving or finishing is no reason to use this, and neither
  is something else seeming more important.

  You don't need this before starting a new task — new tasks replace the current one automatically.

  Does NOT cancel scheduled tasks — those still trigger at their scheduled time.
  To adjust speed without stopping, use ChangeSpeed instead.

questEditorId: IntelEngine
scriptName: IntelEngine_Core
executionFunctionName: CancelCurrentTask

parameterMapping:
  - type: speaker
    name: akNPC
    description: You (the NPC cancelling)
  - type: static
    value: false
    name: force

eligibilityRules:
  - conditions:
      - decoratorName: is_in_combat
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} cancelled their task"
isShortLived: true
enabled: true
defaultPriority: 7
tags: []
