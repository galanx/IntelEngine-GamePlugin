customCategory: intel_communication
name: InviteAlong
description: >
  You are on your way to clear out a place (you know it under "What I asked of {{ player.name }}"), you have just met
  {{ player.name }}, and you ask {{ player.name }} to come along and share what you find. {{ player.name }} then
  answers yes or no.

  Use it in the same reply in which you ask {{ player.name }} along in your own words. Not when {{ player.name }}
  asked first (that is TakePlayerAlong), and not for small talk.

questEditorId: IntelEngine_QuestKeeper
scriptName: IntelEngine_Quests
executionFunctionName: InviteAlong

parameterMapping:
  - type: speaker
    name: akNPC
    description: You (the one asking)

eligibilityRules:
  - conditions:
      - decoratorName: is_in_combat
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
      - decoratorName: get_intelengine_venture_invite
        arguments: ["currentActor"]
        comparisonOperator: "is_not_empty"
        expectedValue: ""
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} asked {{ player.name }} to come along"
isShortLived: true
enabled: true
defaultPriority: 5
tags: []
